<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In | Utopia</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
</head>
<body style="margin:0; font-family: Montserrat, Arial, sans-serif; background-color: #f5f5f5;">

  <div style="display:flex; justify-content:center; align-items:center; height:100vh;">
    <div style="background-color:#fff; padding:50px 60px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.1); width:380px; text-align:center;">

      <h2 style="color:#000; font-size:28px; margin-bottom:10px;">Welcome Back</h2>
      <p style="color:rgb(130,130,130); font-family:'Playfair Display',serif; margin-bottom:30px;">Sign in to your Utopia account</p>

      <form action="{% url 'user_login' %}" method="POST">
        {% csrf_token %}
        <input type="text" placeholder="Username" required name="username"
               style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; font-family:'Playfair Display',serif;">
        <input type="password" placeholder="Password" required name="pwd"
               style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ccc; border-radius:4px; font-family:'Playfair Display',serif;">

        <button type="submit"
                style="width:100%; padding:12px; background-color:#D1C286; border:none; color:#fff; font-size:15px; font-weight:500; border-radius:4px; cursor:pointer; transition:0.3s;">
          Sign In
        </button>
      </form>

      <p style="margin-top:20px; font-size:14px; color:#777;">Don’t have an account?
        <a href="{% url 'user_signup_fun' %}" style="color:#000; text-decoration:none; border-bottom:1px solid #D1C286;">Sign up</a>
      </p>
    </div>
  </div>
</body>
</html>
