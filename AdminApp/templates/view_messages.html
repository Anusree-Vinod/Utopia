<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="card-body">
              <h5 class="card-title">User Messages</h5>
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>

                      <th scope="col">User Name</th>
                      <th scope="col">Email</th>
                      <th scope="col">Message</th>
                      <th scope="col">Operations</th>
                    </tr>
                  </thead>
                  <tbody>
                  {% for i in data %}
                    <tr>

                      <td>{{i.name}}</td>
                      <td>{{i.email}}</td>
                      <td>{{i.message}}</td>
                      <td><a href="{% url 'delete_message' m_id=i.id %}" class="btn btn-light">Delete</a></td>

                    </tr>
                  {% endfor %}
                  </tbody>
                </table>
              </div>
            </div>
</body>
</html>
{% endblock %}
